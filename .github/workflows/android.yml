name: Android

on:
  push:
    branches: [main, master]
    paths:
      - 'pwa/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Capacitor 6 = AGP 8.2 / Gradle 8.2 -> Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # setup-node's built-in cache needs a lockfile; cache ~/.npm directly so it works without one.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Copy web assets (+ native bridge)
        run: npm run prepare-www

      - name: Add Android platform if absent
        run: '[ -d android ] || npx cap add android'

      - name: Generate icons and splash from pwa/icon.svg
        run: npm run assets:android

      - name: Sync
        run: npx cap sync android

      - name: Configure native (portrait, immersive, dark theme)
        run: npm run configure-native

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kingdoms-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
